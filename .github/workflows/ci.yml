name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # Checked before the build, because an unformatted tree is the cheapest
      # failure to report and there is no reason to spend a build on it.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector is not optional here: this system runs long-lived
      # concurrent work, and a data race that only shows under load is exactly
      # the class of bug a test run without -race will pass straight through.
      - name: Test
        run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # Separate job so a lint finding and a test failure are reported
      # together, rather than the first one hiding the second.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
